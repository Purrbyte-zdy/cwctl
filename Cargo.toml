[package]
name = "cwctl"
version = "27.0.0-alpha1"
edition = "2021"
description = "Console management CLI for Class Widgets 2 plugins"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
reedline = "0.38"
